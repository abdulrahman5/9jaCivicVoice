<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public issue map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B47}a:hover{color:#0A4F34}
.ph{background:repeating-linear-gradient(45deg,#E4E4DE 0 8px,#EFEFEA 8px 16px)}
.grid{background-color:#EEEEE8;background-image:linear-gradient(#DCDCD5 1px,transparent 1px),linear-gradient(90deg,#DCDCD5 1px,transparent 1px);background-size:48px 48px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAF7; color: #1A1A1A; font-family: 'Public Sans', system-ui, sans-serif; overflow: hidden">
  <div class="grid" style="flex: 1; position: relative; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; top: 0; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #fff; border: 1px solid #D9D9D4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input type="search" placeholder="Search area, LGA or ward" aria-label="Search area" style="flex: 1; border: 0; outline: none; background: none; font: inherit; font-size: 15px; color: #1A1A1A">
      </label>
      <div style="display: flex; gap: 8px; overflow: hidden">
        <button style="padding: 8px 12px; border-radius: 999px; border: 1px solid #1A1A1A; background: #1A1A1A; color: #fff; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap">All</button>
        <button style="padding: 8px 12px; border-radius: 999px; border: 1px solid #D9D9D4; background: #fff; color: #1A1A1A; font: inherit; font-size: 13px; white-space: nowrap">Roads</button>
        <button style="padding: 8px 12px; border-radius: 999px; border: 1px solid #D9D9D4; background: #fff; color: #1A1A1A; font: inherit; font-size: 13px; white-space: nowrap">Power</button>
        <button style="padding: 8px 12px; border-radius: 999px; border: 1px solid #D9D9D4; background: #fff; color: #1A1A1A; font: inherit; font-size: 13px; white-space: nowrap">Water</button>
        <button style="display: flex; gap: 4px; align-items: center; padding: 8px 12px; border-radius: 999px; border: 1px solid #D9D9D4; background: #fff; color: #1A1A1A; font: inherit; font-size: 13px; white-space: nowrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg>Status
        </button>
      </div>
    </div>

    <div style="position: absolute; left: -20px; top: 300px; width: 440px; height: 22px; background: #FFFFFF; transform: rotate(-12deg); border-top: 1px solid #D9D9D4; border-bottom: 1px solid #D9D9D4"></div>
    <div style="position: absolute; left: 210px; top: 120px; width: 18px; height: 560px; background: #FFFFFF; transform: rotate(8deg); border-left: 1px solid #D9D9D4; border-right: 1px solid #D9D9D4"></div>

    <span style="position: absolute; left: 60px; top: 190px; width: 44px; height: 44px; border-radius: 22px; background: #1A1A1A; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; border: 3px solid #fff">12</span>
    <span style="position: absolute; left: 260px; top: 220px; width: 36px; height: 36px; border-radius: 18px; background: #1A1A1A; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 3px solid #fff">5</span>
    <span style="position: absolute; left: 120px; top: 330px; width: 56px; height: 56px; border-radius: 28px; background: #8A4B00; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; border: 4px solid #FBEBD7">214</span>
    <span style="position: absolute; left: 300px; top: 360px; width: 32px; height: 32px; border-radius: 16px; background: #1A1A1A; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 3px solid #fff">3</span>
    <span style="position: absolute; left: 40px; top: 430px; width: 32px; height: 32px; border-radius: 16px; background: #0F6B47; color: #fff; display: flex; align-items: center; justify-content: center; border: 3px solid #fff"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>

    <button aria-label="Centre on my location" style="position: absolute; right: 16px; top: 400px; width: 48px; height: 48px; border-radius: 24px; border: 1px solid #D9D9D4; background: #fff; display: flex; align-items: center; justify-content: center; color: #1A1A1A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>

    <section style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; border-top: 1px solid #D9D9D4; padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D9D9D4"></div>
      <div style="display: flex; gap: 12px">
        <div class="ph" style="width: 64px; height: 64px; border-radius: 8px; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #FBEBD7; color: #8A4B00">Acknowledged · day 5</span>
          <div style="font-size: 15px; font-weight: 700">No power for 5 days after storm</div>
          <div style="font-size: 13px; color: #5C5C5C">[Estate], Ikeja · 4 merged reports</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 44px; border-radius: 12px; border: 0; background: #0F6B47; color: #fff; font: inherit; font-size: 14px; font-weight: 600">+1 Me too (214)</button>
        <a href="Tracking.dc.html" style="height: 44px; border-radius: 12px; border: 1px solid #1A1A1A; display: flex; align-items: center; justify-content: center; color: #1A1A1A; font-size: 14px; font-weight: 600; text-decoration: none">View details</a>
      </div>
    </section>
  </div>

  <nav aria-label="Primary" style="display: flex; justify-content: space-around; align-items: flex-end; border-top: 1px solid #D9D9D4; background: #fff; padding: 8px 8px 22px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; min-height: 44px; font-size: 11px; color: #5C5C5C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home
    </a>
    <a href="Map.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; min-height: 44px; font-size: 11px; font-weight: 600; color: #0F6B47; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map
    </a>
    <a href="Report-Category.dc.html" aria-label="Report an issue" style="width: 56px; height: 56px; border-radius: 28px; background: #0F6B47; color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Tracking.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; min-height: 44px; font-size: 11px; color: #5C5C5C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>My reports
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 60px; min-height: 44px; font-size: 11px; color: #5C5C5C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Account
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
