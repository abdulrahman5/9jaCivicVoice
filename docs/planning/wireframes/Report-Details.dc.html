<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report: details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B47}a:hover{color:#0A4F34}
.ph{background:repeating-linear-gradient(45deg,#E4E4DE 0 8px,#EFEFEA 8px 16px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAFAF7; color: #1A1A1A; font-family: 'Public Sans', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px">
    <a href="Report-Category.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1A1A1A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 15px; font-weight: 600">Electricity · Outage</div>
    <button style="height: 44px; padding: 0 12px; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: #5C5C5C">Save draft</button>
  </header>

  <div style="padding: 0 20px 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 6px" aria-label="Step 2 of 3">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #0F6B47"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #0F6B47"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #D9D9D4"></div>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5C5C5C">STEP 2 OF 3 · WHERE &amp; WHAT</div>
  </div>

  <main style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 16px">
    <div role="status" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #FBEBD7; color: #5E3300">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17h.01"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">
        <strong style="font-size: 14px">3 similar reports within 500 m</strong>
        <span>"No power for 5 days after storm" — add your voice instead of a new report?</span>
        <a href="Tracking.dc.html" style="font-weight: 700; color: #5E3300">View &amp; tap Me too →</a>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 600">Location</div>
      <div class="ph" style="height: 112px; border-radius: 12px; border: 1px solid #D9D9D4; position: relative; display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="#0F6B47" stroke="#fff" stroke-width="1.5" aria-hidden="true"><path d="M12 22s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"></path><circle cx="12" cy="10" r="2.5" fill="#fff"></circle></svg>
        <span style="position: absolute; left: 8px; bottom: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5C5C5C; background: #fff; padding: 2px 6px; border-radius: 4px">MAP · drag pin to adjust</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">
        <span><strong>[Street], Ikeja LGA</strong> · Ward [04]</span>
        <button style="border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: #0F6B47; min-height: 32px">Change</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 600">Evidence <span style="font-weight: 400; color: #5C5C5C">(optional)</span></div>
      <div style="display: flex; gap: 8px">
        <div class="ph" style="width: 72px; height: 72px; border-radius: 10px"></div>
        <button aria-label="Add photo" style="width: 72px; height: 72px; border-radius: 10px; border: 1.5px dashed #9A9A94; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #3D3D3D; font: inherit; font-size: 11px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>Photo
        </button>
        <button aria-label="Record voice note" style="flex: 1; height: 72px; border-radius: 10px; border: 1.5px dashed #9A9A94; background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; color: #3D3D3D; font: inherit; font-size: 13px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Hold to record voice note
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <label for="desc" style="font-size: 14px; font-weight: 600">Describe it</label>
      <textarea id="desc" rows="2" style="box-sizing: border-box; width: 100%; resize: none; padding: 12px; border: 1px solid #D9D9D4; border-radius: 12px; background: #fff; font: inherit; font-size: 14px; color: #1A1A1A">Whole street has been without light since Sunday's storm. Transformer is sparking.</textarea>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px" aria-label="Since when">
        <span style="color: #5C5C5C; align-self: center">Since:</span>
        <button style="padding: 6px 10px; border-radius: 999px; border: 1px solid #D9D9D4; background: #fff; font: inherit; font-size: 13px; color: #1A1A1A">Today</button>
        <button style="padding: 6px 10px; border-radius: 999px; border: 1px solid #0F6B47; background: #DFF0E7; font: inherit; font-size: 13px; font-weight: 600; color: #0A4F34">This week</button>
        <button style="padding: 6px 10px; border-radius: 999px; border: 1px solid #D9D9D4; background: #fff; font: inherit; font-size: 13px; color: #1A1A1A">Over a month</button>
      </div>
    </section>

    <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid #D9D9D4; border-radius: 12px; background: #fff">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F6B47" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Report anonymously</span><span style="font-size: 12px; color: #5C5C5C">Your name and phone are never shown publicly. Photo location data is removed.</span></span>
      <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #0F6B47">
    </label>
  </main>

  <footer style="padding: 14px 20px 28px; border-top: 1px solid #D9D9D4; background: #fff">
    <a href="Tracking.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #0F6B47; color: #fff; font-size: 16px; font-weight: 600; text-decoration: none">Review &amp; submit</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
