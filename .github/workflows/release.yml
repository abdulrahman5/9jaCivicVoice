name: Release

# Production deploy (architecture doc, "Environments and CI/CD"):
# approve → migrate both databases → deploy Worker → deploy web → smoke test.
# Migrations are forward-only and backwards-compatible, so a web rollback is safe.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # requires manual approval in the repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Migrate civic database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.CIVIC_DB_PASSWORD }}
        run: |
          supabase link --workdir db/civic --project-ref "${{ vars.CIVIC_PROJECT_REF }}"
          supabase db push --workdir db/civic

      - name: Migrate police vault database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.VAULT_DB_PASSWORD }}
        run: |
          supabase link --workdir db/vault --project-ref "${{ vars.VAULT_PROJECT_REF }}"
          supabase db push --workdir db/vault

      - name: Deploy police intake Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @civicvoice/police-intake exec wrangler deploy --var VAULT_SUPABASE_URL:${{ vars.VAULT_SUPABASE_URL }} --var PUBLIC_SITE_URL:${{ vars.PUBLIC_SITE_URL }}

      - name: Deploy web app to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Smoke test production
        run: |
          set -e
          curl -fsS "${{ vars.PUBLIC_SITE_URL }}/api/health"
          curl -fsS -o /dev/null "${{ vars.PUBLIC_SITE_URL }}/"
          curl -fsS -o /dev/null "${{ vars.PUBLIC_SITE_URL }}/scorecard"
          curl -fsS -o /dev/null "${{ vars.POLICE_FORM_URL }}/"
